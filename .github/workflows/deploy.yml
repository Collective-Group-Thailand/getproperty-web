# Deploy to the Collective platform (D-230; getproperty-api docs/deployment.md §7) through collective-infra's reusable
# workflows: main → build the arm64 image getproperty/web:sha-… + :uat → deploy UAT · tag vX.Y.Z → build :prod →
# deploy production (GitHub Environment `production` approval). `component: web` makes the box record WEB_IMAGE_TAG,
# pull and restart only the `web` service, health-check it and roll back only that image; no migration (the API's
# deploy runs it). The image takes no build arguments: every environment value is read at run time
# (`collective/<env>/getproperty/web` → /run/collective/getproperty-web.env), so `promote.yml` can ship the UAT bytes.
# Needs collective-infra at a tag with the getproperty/r1-platform changes (component deploys) — `@v1` below until
# that tag is cut — and the GitHub Environments `uat` / `production` with AWS_DEPLOY_ROLE_ARN, INSTANCE_ID,
# AWS_REGION=ap-southeast-7 (collective-infra README §3.4). The api image must have been deployed once first.
name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build-uat:
    if: github.ref == 'refs/heads/main'
    uses: Collective-Group-Thailand/collective-infra/.github/workflows/reusable-build-push.yml@v1
    with:
      image: getproperty/web
      environment: uat
      moving_tag: uat

  deploy-uat:
    needs: build-uat
    uses: Collective-Group-Thailand/collective-infra/.github/workflows/reusable-deploy.yml@v1
    with:
      product: getproperty
      component: web
      migrate: false
      environment: uat
      image_tag: ${{ needs.build-uat.outputs.image_tag }}

  build-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: Collective-Group-Thailand/collective-infra/.github/workflows/reusable-build-push.yml@v1
    with:
      image: getproperty/web
      environment: production
      moving_tag: prod

  deploy-prod:
    needs: build-prod
    uses: Collective-Group-Thailand/collective-infra/.github/workflows/reusable-deploy.yml@v1
    with:
      product: getproperty
      component: web
      migrate: false
      environment: production
      image_tag: ${{ needs.build-prod.outputs.image_tag }}
