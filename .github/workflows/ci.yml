name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  OWNER_HOST: "localhost:3100"
  STAFF_HOST: "staff.localhost:3100"
  ADMIN_HOST: "admin.localhost:3100"

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      # The generated CSS and the copied font files are committed; a stale copy must fail here.
      - name: Design tokens are up to date
        run: pnpm tokens:check
      - name: Font files match the installed packages
        run: pnpm fonts --check
      - name: Typecheck
        run: pnpm typecheck
      # Includes the WCAG 2.2 AA contrast gate over every semantic token pair in all three themes
      # (ADR-0003), axe over every Storybook story, and the ESLint rule fixtures.
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Release hygiene (no mock or debug traces in the build)
        run: pnpm release:hygiene

  e2e:
    name: e2e (three zone shells, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (builds and starts the app itself)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  storybook:
    name: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 14

  # F1 adds: `contract` (pnpm gen:api --check against contract.lock.json) and `lighthouse` (pnpm lhci).
