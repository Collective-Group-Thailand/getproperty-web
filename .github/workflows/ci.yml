name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  OWNER_HOST: "localhost:3100"
  STAFF_HOST: "staff.localhost:3100"
  ADMIN_HOST: "admin.localhost:3100"

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # @collective/web-kit + @collective/content (D-275): `file:../../collective-shared/packages/*` until they are on
      # GitHub Packages — checked out two levels up and built before the install copies them in.
      - name: Check out and build collective-shared
        env:
          TOKEN: ${{ secrets.ASSET_CORE_READ_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Collective-Group-Thailand/collective-shared.git" ../../collective-shared
          (cd ../../collective-shared && pnpm install --frozen-lockfile && pnpm build)
      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      # The generated CSS and the copied font files are committed; a stale copy must fail here.
      - name: Design tokens are up to date
        run: pnpm tokens:check
      - name: Font files match the installed packages
        run: pnpm fonts --check
      - name: Icon glyphs match the curated set (D-179)
        run: pnpm icons:check
      # The staff service worker bundle and the brand kit (logo geometry, favicons, app/PWA icons, OG card) are committed too.
      - name: Service worker bundle is up to date
        run: pnpm sw:check
      - name: Brand assets match the founder's logo (docs/brand)
        run: pnpm brand:check
      # The generated API types, client flags and MSW base data must match the pinned contract.
      - name: Contract drift (generated files vs contract.lock.json)
        run: pnpm gen:api:check
      - name: Typecheck
        run: pnpm typecheck
      # Includes the WCAG 2.2 AA contrast gate over every semantic token pair in all three themes
      # (ADR-0003), axe over every Storybook story, and the ESLint rule fixtures.
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Release hygiene (no mock or debug traces in the build)
        run: pnpm release:hygiene

  e2e:
    name: e2e (three zone shells, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # @collective/web-kit + @collective/content (D-275): `file:../../collective-shared/packages/*` until they are on
      # GitHub Packages — checked out two levels up and built before the install copies them in.
      - name: Check out and build collective-shared
        env:
          TOKEN: ${{ secrets.ASSET_CORE_READ_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Collective-Group-Thailand/collective-shared.git" ../../collective-shared
          (cd ../../collective-shared && pnpm install --frozen-lockfile && pnpm build)
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (builds and starts the app itself)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  storybook:
    name: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # @collective/web-kit + @collective/content (D-275): `file:../../collective-shared/packages/*` until they are on
      # GitHub Packages — checked out two levels up and built before the install copies them in.
      - name: Check out and build collective-shared
        env:
          TOKEN: ${{ secrets.ASSET_CORE_READ_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Collective-Group-Thailand/collective-shared.git" ../../collective-shared
          (cd ../../collective-shared && pnpm install --frozen-lockfile && pnpm build)
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Visual baselines of the zone shells (e2e/visual/*-snapshots, updated deliberately).
      - name: Shell visual snapshots
        run: pnpm e2e:visual
      # The runner's renders (*-actual.png beside *-diff.png): reviewed, they become the new baselines.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-results
          path: test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 14

  # The platform image (Dockerfile, D-230): it builds, boots with the platform's real hostnames, answers the compose
  # healthcheck and the metrics scrape, and routes each zone by host. The arm64 build that ships runs in
  # collective-infra's reusable-build-push.yml (deploy.yml); this one is the runner's architecture.
  image:
    name: image (docker build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Check out collective-shared for the image (named build context, D-275)
        env:
          TOKEN: ${{ secrets.ASSET_CORE_READ_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Collective-Group-Thailand/collective-shared.git" ../../collective-shared
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: collective-shared-src=../../collective-shared
          load: true
          tags: getproperty/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke (healthz, metrics, zones by host, TZ)
        run: |
          docker run -d --name web -p 3000:3000 \
            -e OWNER_HOST=uat-app.getproperty.example -e STAFF_HOST=uat-staff.getproperty.example \
            -e ADMIN_HOST=uat-admin.getproperty.example -e API_INTERNAL_URL=http://getproperty-api:3000 \
            -e TRUSTED_HOPS=1 getproperty/web:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' web)" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' web | grep -qx healthy
          docker exec web wget -qO- http://127.0.0.1:3000/api/metrics | grep -q 'nodejs_heap_size_used_bytes{service="getproperty-web"}'
          docker exec web node -e 'console.log(Intl.DateTimeFormat().resolvedOptions().timeZone)' | grep -qx Asia/Bangkok
          # No API here: pages may fail to render, but each host must reach its own zone (and an unknown one none).
          zone() { curl -s -o /dev/null -D - -H "Host: $1" -H 'X-Forwarded-Proto: https' "http://127.0.0.1:3000/login" \
            | tr -d '\r' | sed -n 's/^x-gp-zone: //Ip'; }
          [ "$(zone uat-app.getproperty.example)" = owner ]
          [ "$(zone uat-staff.getproperty.example)" = staff ]
          [ "$(zone uat-admin.getproperty.example)" = admin ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: uat-liff.getproperty.example' http://127.0.0.1:3000/)" = 404 ]
          curl -s -o /dev/null -D - -H 'Host: uat-app.getproperty.example' -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:3000/th/pricing | grep -i '^location: https://uat-app.getproperty.example/pricing'
      - if: failure()
        run: docker logs web || true

  lighthouse:
    name: lighthouse (budgets per zone)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # @collective/web-kit + @collective/content (D-275): `file:../../collective-shared/packages/*` until they are on
      # GitHub Packages — checked out two levels up and built before the install copies them in.
      - name: Check out and build collective-shared
        env:
          TOKEN: ${{ secrets.ASSET_CORE_READ_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Collective-Group-Thailand/collective-shared.git" ../../collective-shared
          (cd ../../collective-shared && pnpm install --frozen-lockfile && pnpm build)
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
        env:
          OWNER_HOST: "localhost:3200"
          STAFF_HOST: "staff.localhost:3200"
          ADMIN_HOST: "admin.localhost:3200"
      # ubuntu-24.04 restricts unprivileged user namespaces (AppArmor): Chrome's sandbox cannot start there
      # ("No usable sandbox!"), so the throwaway runner runs it unsandboxed, as Playwright does.
      - name: Lighthouse CI (owner-marketing, owner, staff, admin)
        run: CHROME_PATH="$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')" pnpm lhci
        env:
          LHCI_CHROME_FLAGS: "--headless=new --no-sandbox"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14

  # The sign-in flows once against the real getproperty-api at the pinned commit (e2e/integration/harness.ts):
  # needs sibling checkouts of getproperty-api and collective-asset-core, so it runs nightly and on demand.
  integration:
    name: e2e:integration (real getproperty-api)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          path: getproperty-web
      - uses: actions/checkout@v5
        with:
          repository: collective-group/getproperty-api
          path: getproperty-api
          fetch-depth: 0
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
      - uses: actions/checkout@v5
        with:
          repository: collective-group/collective-asset-core
          path: collective-asset-core
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: getproperty-web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: getproperty-web/.nvmrc
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: collective-asset-core
      # @collective/web-kit + @collective/content (D-275): `file:../../collective-shared/packages/*` until they are on
      # GitHub Packages — checked out two levels up and built before the install copies them in.
      - name: Check out and build collective-shared
        env:
          TOKEN: ${{ secrets.ASSET_CORE_READ_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Collective-Group-Thailand/collective-shared.git" ../../collective-shared
          (cd ../../collective-shared && pnpm install --frozen-lockfile && pnpm build)
      - run: pnpm install --frozen-lockfile
        working-directory: getproperty-api
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
        working-directory: getproperty-web
      - run: pnpm e2e:integration
        working-directory: getproperty-web
